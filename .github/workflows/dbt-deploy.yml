name: dbt Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dbt-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DBT_PROFILES_DIR: .github/dbt
      DBT_ENV_SECRET_SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      WAYPLORER_LANDING_SCHEMA: ${{ secrets.WAYPLORER_LANDING_SCHEMA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dbt
        run: python -m pip install --upgrade pip dbt-snowflake==1.12.0

      - name: Write dbt profile
        shell: bash
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat <<'EOF' > "$DBT_PROFILES_DIR/profiles.yml"
          wayplorer:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                password: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_PASSWORD') }}"
                authenticator: snowflake
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
                schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
                threads: 4
                client_session_keep_alive: false
          EOF

      - name: Check dbt connection
        run: dbt debug

      - name: Run dbt
        run: |
          dbt run --vars '{"wayplorer_landing_schema": "'"$WAYPLORER_LANDING_SCHEMA"'"}'

      - name: Test dbt
        run: |
          dbt test --vars '{"wayplorer_landing_schema": "'"$WAYPLORER_LANDING_SCHEMA"'"}'
