version: 2

models:
  - name: mart_tenant_daily_pipeline_health
    description: Gold-like Snowflake mart for tenant-day pipeline and KPI health.
    columns:
      - name: organization_id
        tests:
          - not_null
      - name: kpi_date
        tests:
          - not_null
      - name: pipeline_health_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BLOCKED', 'HEALTHY', 'WATCH', 'AT_RISK']

  - name: mart_tenant_module_snapshot
    description: Tenant and module snapshot for CRM record distribution and amount coverage.
    columns:
      - name: organization_id
        tests:
          - not_null
      - name: module_key
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACCOUNTS', 'LEADS', 'OPPORTUNITIES']
