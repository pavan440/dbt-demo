version: 2

sources:
  - name: wayplorer_bronze
    database: "{{ target.database }}"
    schema: "{{ var('wayplorer_bronze_schema', 'BRONZE') }}"
    description: Raw Wayplorer CRM entities landed before Silver normalization.
    tables:
      - name: account_raw
        identifier: ACCOUNT_RAW
        description: Raw account CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: accountId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null
      - name: lead_raw
        identifier: LEAD_RAW
        description: Raw lead CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: leadId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null
      - name: opportunity_raw
        identifier: OPPORTUNITY_RAW
        description: Raw opportunity CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: opportunityId
            tests:
