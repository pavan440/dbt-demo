version: 2

sources:
  - name: wayplorer_bronze
    database: "{{ target.database }}"
    schema: "{{ var('wayplorer_bronze_schema', 'BRONZE') }}"
    description: >
      Raw Wayplorer CRM entities landed before Silver normalization.

      Disabled by default: these tables are generated locally under data/bronze
      and uploaded to S3, but have never been loaded into Snowflake, so the
      column tests below fail with "table does not exist" on every CI run. The
      definitions are kept because they document the intended contract.

      Enable once the bronze load exists:
        dbt build --vars '{"wayplorer_bronze_enabled": true}'
    config:
      enabled: "{{ var('wayplorer_bronze_enabled', false) }}"
    tables:
      - name: account_raw
        identifier: ACCOUNT_RAW
        description: Raw account CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: accountId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null
      - name: lead_raw
        identifier: LEAD_RAW
        description: Raw lead CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: leadId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null
      - name: opportunity_raw
        identifier: OPPORTUNITY_RAW
        description: Raw opportunity CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: opportunityId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null
      - name: contract_raw
        identifier: CONTRACT_RAW
        description: Raw contract CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: contractId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null
      - name: call_raw
        identifier: CALL_RAW
        description: Raw call activity CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: callId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null
      - name: email_raw
        identifier: EMAIL_RAW
        description: Raw email activity CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: emailId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null
      - name: task_raw
        identifier: TASK_RAW
        description: Raw task activity CDC records.
        columns:
          - name: applicationId
            tests:
              - not_null
          - name: taskId
            tests:
              - not_null
          - name: clientId
            tests:
              - not_null
          - name: cdc_timestamp
            tests:
              - not_null